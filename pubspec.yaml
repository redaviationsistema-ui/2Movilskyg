name: red_sky
description: "Red Sky mobile marketplace for private flights."
publish_to: 'none'

version: 1.0.0+12

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  #intl: ^0.19.0
  intl: ^0.20.0
  uuid: ^4.3.3
  dropdown_search: ^5.0.6
  pdf: ^3.10.8
  http: ^1.2.0
  http_parser: ^4.1.2
  image: ^4.5.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  supabase_flutter: ^2.3.4
  flutter_stripe: ^13.0.0
  camera: ^0.11.2+1
  image_picker: ^1.2.2
  file_picker:
    path: third_party/file_picker
  permission_handler: ^12.0.3
  mobile_scanner: ^7.2.0
  signature: ^6.3.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  table_calendar: ^3.1.3
  web_socket_channel: ^3.0.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^19.5.0
  app_links: ^6.4.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  image_picker_ios: 0.8.13+6
  stripe_ios:
    path: third_party/stripe_ios

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/home/HomeCel.png
    - assets/login/image.png
    - assets/login/image_portrait.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/Logo.png
  remove_alpha_ios: true
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/Logo.png
  min_sdk_android: 21
