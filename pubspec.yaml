name: red_sky
description: "Red Sky mobile marketplace for private flights."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  #intl: ^0.20.0
  uuid: ^4.3.3
  dropdown_search: ^5.0.6
  pdf: ^3.10.8
  printing: ^5.12.0
  http: ^1.2.0
  image: ^4.5.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  supabase_flutter: ^2.3.4
  flutter_stripe: ^11.5.0
  camera: ^0.11.2+1
  image_picker: ^1.2.1
  file_picker: ^11.0.2
  permission_handler: ^12.0.3
  mobile_scanner: ^7.2.0
  google_mlkit_text_recognition: ^0.15.0
  signature: ^6.3.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  table_calendar: ^3.1.3
  web_socket_channel: ^3.0.3
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  remove_alpha_ios: true
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo.png
  min_sdk_android: 21
